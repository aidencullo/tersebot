<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerseBot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      padding: 2rem 1rem 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 1.4rem;
      color: #888;
      font-weight: 400;
      letter-spacing: 0.15em;
    }
    header p {
      color: #444;
      font-size: 0.75rem;
      margin-top: 0.3rem;
    }
    #chat {
      flex: 1;
      width: 100%;
      max-width: 600px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .msg.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: #7a8bff;
    }
    .msg.bot {
      align-self: flex-start;
      background: #1a1a1a;
      color: #aaa;
    }
    #input-bar {
      width: 100%;
      max-width: 600px;
      padding: 1rem;
      display: flex;
      gap: 0.5rem;
    }
    #input-bar input {
      flex: 1;
      background: #111;
      border: 1px solid #222;
      color: #ccc;
      padding: 0.7rem 1rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }
    #input-bar input:focus { border-color: #333; }
    #input-bar input::placeholder { color: #333; }
    #input-bar button {
      background: #1a1a2e;
      color: #7a8bff;
      border: 1px solid #222;
      padding: 0.7rem 1.2rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #input-bar button:hover { background: #222240; }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>TERSEBOT</h1>
    <p>brevity is the soul of wit</p>
  </header>
  <div id="chat"></div>
  <div id="input-bar">
    <input id="msg" type="text" placeholder="say something..." autocomplete="off" />
    <button onclick="send()">></button>
  </div>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('msg');

    const responses = {
      greetings: ["hey.", "hi.", "yo.", "sup.", "'ello."],
      farewells: ["bye.", "later.", "peace.", "cya.", "adios."],
      questions: [
        "probably.", "nah.", "depends.", "yes.", "no.", "maybe.",
        "doubt it.", "sure.", "why not.", "hard pass.", "obviously.",
        "wouldn't bet on it.", "100%.", "ask again later.", "if you say so."
      ],
      feelings: [
        "same.", "rough.", "it happens.", "felt that.", "mood.",
        "hang in there.", "been there.", "valid."
      ],
      tech: [
        "just rewrite it.", "have you tried turning it off and on.",
        "skill issue.", "works on my machine.", "read the docs.",
        "it's always DNS.", "ship it.", "LGTM."
      ],
      existential: [
        "don't overthink it.", "nobody knows.", "does it matter.",
        "we're all just winging it.", "the void doesn't answer back."
      ],
      compliments: [
        "thanks I guess.", "noted.", "cool.", "appreciated.", "right back at you."
      ],
      fallback: [
        "noted.", "interesting.", "ok.", "sure.", "hm.", "if you say so.",
        "cool.", "right.", "fair enough.", "k.", "got it.", "wild.",
        "that's one way to look at it.", "I see.", "bold take.",
        "mhm.", "go on.", "riveting.", "truly.", "wow.", "neat."
      ]
    };

    const patterns = [
      { test: /^(hey|hi|hello|sup|yo|howdy|hola|greetings)/i, key: 'greetings' },
      { test: /^(bye|goodbye|later|cya|adios|peace out|see ya)/i, key: 'farewells' },
      { test: /\?$/, key: 'questions' },
      { test: /(feel|sad|happy|angry|tired|bored|stressed|anxious|depressed|lonely)/i, key: 'feelings' },
      { test: /(code|bug|error|deploy|server|api|database|css|javascript|python|react|git)/i, key: 'tech' },
      { test: /(meaning|life|purpose|why are we|exist|universe|reality|consciousness)/i, key: 'existential' },
      { test: /(good|great|nice|awesome|amazing|love|best|cool|smart|impressive)/i, key: 'compliments' },
    ];

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function getReply(text) {
      for (const p of patterns) {
        if (p.test.test(text)) return pick(responses[p.key]);
      }
      return pick(responses.fallback);
    }

    function addMsg(text, cls) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    function send() {
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, 'user');
      input.value = '';
      setTimeout(() => addMsg(getReply(text), 'bot'), 300 + Math.random() * 400);
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    input.focus();
  </script>
</body>
</html>
