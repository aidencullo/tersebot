<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TerseBot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      padding: 2rem 1rem 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 1.4rem;
      color: #888;
      font-weight: 400;
      letter-spacing: 0.15em;
    }
    header p {
      color: #444;
      font-size: 0.75rem;
      margin-top: 0.3rem;
    }
    #key-bar {
      width: 100%;
      max-width: 600px;
      padding: 0.5rem 1rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    #key-bar input {
      flex: 1;
      background: #111;
      border: 1px solid #1a1a2e;
      color: #555;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.75rem;
      outline: none;
    }
    #key-bar input:focus { border-color: #333; }
    #key-bar input::placeholder { color: #2a2a2a; }
    #key-bar label {
      color: #333;
      font-size: 0.7rem;
      white-space: nowrap;
    }
    #key-bar .status {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }
    #key-bar .status.ok { background: #4a7; }
    #chat {
      flex: 1;
      width: 100%;
      max-width: 600px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .msg {
      max-width: 85%;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
    }
    .msg.user {
      align-self: flex-end;
      background: #1a1a2e;
      color: #7a8bff;
    }
    .msg.bot {
      align-self: flex-start;
      background: #1a1a1a;
      color: #aaa;
    }
    .msg.bot.error {
      color: #a55;
    }
    .msg.bot.typing {
      color: #555;
    }
    #input-bar {
      width: 100%;
      max-width: 600px;
      padding: 1rem;
      display: flex;
      gap: 0.5rem;
    }
    #input-bar input {
      flex: 1;
      background: #111;
      border: 1px solid #222;
      color: #ccc;
      padding: 0.7rem 1rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }
    #input-bar input:focus { border-color: #333; }
    #input-bar input::placeholder { color: #333; }
    #input-bar button {
      background: #1a1a2e;
      color: #7a8bff;
      border: 1px solid #222;
      padding: 0.7rem 1.2rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #input-bar button:hover { background: #222240; }
    #input-bar button:disabled { opacity: 0.3; cursor: default; }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>TERSEBOT</h1>
    <p>brevity is the soul of wit</p>
  </header>
  <div id="key-bar">
    <label>API key</label>
    <input id="apikey" type="password" placeholder="sk-ant-..." autocomplete="off" />
    <div class="status" id="status"></div>
  </div>
  <div id="chat"></div>
  <div id="input-bar">
    <input id="msg" type="text" placeholder="say something..." autocomplete="off" />
    <button id="sendbtn" onclick="send()">></button>
  </div>
  <script>
    const PROXY = 'https://tersebot-proxy.aidencullo.workers.dev';
    const chat = document.getElementById('chat');
    const input = document.getElementById('msg');
    const apiKeyInput = document.getElementById('apikey');
    const statusDot = document.getElementById('status');
    const sendBtn = document.getElementById('sendbtn');
    const history = [];
    let busy = false;

    // persist key in localStorage
    const saved = localStorage.getItem('tersebot-key');
    if (saved) {
      apiKeyInput.value = saved;
      statusDot.classList.add('ok');
    }
    apiKeyInput.addEventListener('input', () => {
      const k = apiKeyInput.value.trim();
      localStorage.setItem('tersebot-key', k);
      statusDot.classList.toggle('ok', k.startsWith('sk-ant-'));
    });

    function addMsg(text, cls) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    async function send() {
      const text = input.value.trim();
      const key = apiKeyInput.value.trim();
      if (!text || busy) return;
      if (!key) { addMsg('enter your anthropic API key above.', 'bot error'); return; }

      addMsg(text, 'user');
      history.push({ role: 'user', content: text });
      input.value = '';
      busy = true;
      sendBtn.disabled = true;

      const typing = addMsg('...', 'bot typing');

      try {
        const resp = await fetch(PROXY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': key },
          body: JSON.stringify({ messages: history }),
        });
        const data = await resp.json();
        typing.remove();

        if (data.error) {
          addMsg(data.error.message || 'something went wrong.', 'bot error');
        } else {
          const reply = data.content[0].text;
          history.push({ role: 'assistant', content: reply });
          addMsg(reply, 'bot');
        }
      } catch (e) {
        typing.remove();
        addMsg('network error.', 'bot error');
      }

      busy = false;
      sendBtn.disabled = false;
    }

    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    input.focus();
  </script>
</body>
</html>
